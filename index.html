<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./assets/to-do-list.png" type="image/x-icon">
    <title>Todo List</title>
</head>
<body>
    <div class="text-area">
        <h1>Todo List <img src="./assets/to-do-list.png" alt="todo Icon" style="width: 50px; height: 60px;"></h1>
        <p>enjoy adding tasks to your list</p>
    </div>

    <div class="container">
        <input type="text" id="input" placeholder="Add your task">
        <button id="taskBtn">ADD</button>
    </div>
    
    <div class="list">
        <ul id="taskList"></ul>
    </div>

    <script src="index.js"></script>
</body>
</html>
